# =====================================================================
# Exemple de configuration - NE CONTIENT AUCUNE VALEUR REELLE
# Ces valeurs doivent etre fournies via des variables d'environnement
# (ou un fichier .env non versionne), jamais commitees.
# =====================================================================

# Pour le developpement local, creer application-local.properties (ignore par Git) et lancer avec : mvnw spring-boot:run -Dspring-boot.run.profiles=local

# URL JDBC PostgreSQL (Neon) - SSL obligatoire
# Format : jdbc:postgresql://HOTE/BASE?sslmode=require
# DB_URL=jdbc:postgresql://HOTE/BASE?sslmode=require

# Utilisateur de la base
# DB_USER=

# Mot de passe de la base
# DB_PASSWORD=

# Cle API Resend (envoi des e-mails de notification)
# RESEND_API_KEY=

# Adresse expeditrice (domaine verifie sur Resend ; defaut onboarding@resend.dev)
# RESEND_FROM_EMAIL=

# Mot de passe du compte "admin" cree par le chargeur de demo
# (si absent, le compte admin n'est pas cree et un avertissement est logge)
# ADMIN_PASSWORD=

# Port HTTP (optionnel, 8080 par defaut)
# PORT=8080

# Desactiver le chargeur de donnees de demo (true par defaut)
# APP_SEED_ENABLED=false

# Origines autorisees pour CORS (front React), separees par des virgules - pas de joker.
# Defaut : http://localhost:5173,http://127.0.0.1:5173
# CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173

# Adresse qui recoit les messages du formulaire de contact public (POST /api/public/contact).
# Sans elle, le formulaire repond 503 et l'erreur est loggee.
# CONTACT_TO_EMAIL=

# Secret de signature des jetons JWT (API REST) : 32 caracteres minimum, 64 recommandes.
# Generer par exemple avec : openssl rand -base64 64
# Obligatoire avec le profil "prod" (l'application refuse de demarrer sans). Sans lui, en developpement,
# une cle aleatoire est generee a chaque demarrage (les sessions sont alors perdues au redemarrage).
# JWT_SECRET=

# Duree de validite d'un jeton en minutes (480 = 8 heures par defaut, maximum 10080)
# JWT_EXPIRATION_MINUTES=480

# Pour la production, activer le profil "prod" : SPRING_PROFILES_ACTIVE=prod
