# ===============================
# Application
# ===============================
spring.application.name=centreFormation
server.port=${PORT:8080}

# Ne jamais exposer de details d'erreur au client
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ===============================
# PostgreSQL Database Configuration (Neon)
# Toutes les valeurs viennent de l'environnement, voir application-example.properties
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Neon peut mettre quelques secondes a sortir de veille
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Donnees de demo (config/DemoDataLoader)
# ===============================
app.seed.enabled=true

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===============================
# Spring Security (temporaire)
# ===============================
# spring.security.user.name=admin
# spring.security.user.password=admin123
# spring.security.user.roles=ADMIN

# ===============================
# DevTools
# ===============================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ===============================
# Resend Email Configuration
# ===============================
resend.api-key=${RESEND_API_KEY:}
# L'expediteur doit appartenir a un domaine verifie sur Resend
# (onboarding@resend.dev n'envoie qu'a l'adresse du compte Resend)
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
resend.from-name=YIG Formation
