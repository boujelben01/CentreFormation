# ===============================
# Profil prod (Render) - aucune valeur secrete, uniquement des variables d'environnement
# ===============================
server.port=${PORT:8080}
# Render est derriere un proxy HTTPS
server.forward-headers-strategy=native
server.shutdown=graceful

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Ne jamais exposer de details d'erreur
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=never

# Les variables JWT_SECRET / JWT_EXPIRATION_MINUTES n'atteignent pas app.jwt.* par le relaxed binding
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Pool reduit : peu de memoire, Neon pooler
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
# Inferieur au delai de coupure des connexions inactives cote Neon/pooler
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

# Pas de logs SQL en production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=warn

spring.thymeleaf.cache=true
