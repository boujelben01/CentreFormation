<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPortal</title>
    <meta name="description" content="EduPortal : plateforme de gestion des cours, des notes et des plannings pour étudiants et formateurs." />
    <meta name="author" content="EduPortal" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:title" content="EduPortal" />
    <meta property="og:description" content="EduPortal : plateforme de gestion des cours, des notes et des plannings pour étudiants et formateurs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EduPortal" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EduPortal" />

    <!-- Thème appliqué avant le premier rendu : clair par défaut (prefers-color-scheme ignoré),
         choix mémorisé dans localStorage « ep-theme ». -->
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("ep-theme") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
